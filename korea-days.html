<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KC · Korea Days Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .header .sub { font-size: 13px; color: #666; margin-left: auto; }

  /* ── Main hero ── */
  .hero {
    padding: 32px 24px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .status-card {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 16px;
    padding: 28px 16px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    display: flex;
    gap: 0;
    align-items: stretch;
  }
  .status-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent, #22c55e);
    border-radius: 16px 16px 0 0;
  }
  .status-col {
    flex: 1;
    min-width: 0;
    padding: 0 24px;
  }
  .status-col + .status-col { border-left: 1px solid #2a2d3a; }
  .status-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }
  .status-hero .status-badge { align-self: center; }
  .status-right {
    display: flex;
    flex-direction: column;
  }
  .danger-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #666;
    margin-bottom: 10px;
  }
  .danger-summary {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
  }
  .danger-summary strong { color: #f59e0b; }
  .danger-clear {
    font-size: 14px;
    color: #22c55e;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .selected-date-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #666;
    margin-bottom: 8px;
  }
  .selected-date-display {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
  }
  .selected-date-display .relative-label {
    font-size: 14px;
    font-weight: 400;
    color: #888;
    margin-left: 10px;
  }

  .metrics-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 20px;
    align-items: center;
  }
  .metric { }
  .metric-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #666; margin-bottom: 4px; }
  .metric-value { font-size: 40px; font-weight: 800; line-height: 1; }
  .metric-value.days-left { color: var(--accent, #22c55e); font-size: 72px; }
  .metric-value.days-used { color: #555; font-size: 28px; font-weight: 500; }
  .metric-value.cap { color: #444; font-size: 28px; font-weight: 500; }

  .progress-wrap {
    grid-column: 1 / -1;
    margin-top: 8px;
  }
  .progress-bar-bg {
    background: #2a2d3a;
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent, #22c55e);
    transition: width 0.3s ease;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #555;
    margin-top: 4px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--badge-bg, rgba(34,197,94,0.15));
    color: var(--accent, #22c55e);
    border: 1px solid var(--accent, #22c55e);
    white-space: nowrap;
    align-self: flex-start;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent, #22c55e);
  }

  /* ── Calendar strip ── */
  .cal-strip-wrap {
    position: relative;
    margin-bottom: 24px;
    user-select: none;
  }
  .cal-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding: 4px 2px 8px;
    scrollbar-width: none;
  }
  .cal-strip::-webkit-scrollbar { display: none; }
  .cal-day {
    flex: 0 0 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 2px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    background: #1a1d27;
  }
  .cal-day:hover { background: #252836; border-color: #3a3d4a; }
  .cal-day.cal-today { border-color: #3a3d4a; }
  .cal-day.cal-today .cal-dow { color: #aaa; }
  .cal-day.cal-selected {
    background: #252836;
    border-color: var(--sel-accent, #22c55e);
  }
  .cal-day.cal-in-korea { background: rgba(59,130,246,0.07); }
  .cal-month {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #4a4d5a;
    line-height: 1;
  }
  .cal-month.month-start { color: #60a5fa; }
  .cal-dow {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #555;
  }
  .cal-dom {
    font-size: 13px;
    font-weight: 700;
    color: #ccc;
  }
  .cal-day.cal-selected .cal-dom { color: #fff; }
  .cal-day.cal-today .cal-dom { color: #fff; }
  .cal-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: transparent;
  }
  .cal-day.cal-today .cal-dot { background: #555; }
  .cal-rem {
    font-size: 13px;
    font-weight: 800;
    line-height: 1;
    border-radius: 5px;
    padding: 2px 5px;
    color: #000;
    margin-top: 1px;
  }
  .cal-arrow {
    position: absolute;
    top: 50%; transform: translateY(-60%);
    width: 24px; height: 24px;
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 13px; color: #888;
    z-index: 2;
    transition: background 0.12s, color 0.12s;
  }
  .cal-arrow:hover { background: #2a2d3a; color: #fff; }
  .cal-arrow-left  { left: -12px; }
  .cal-arrow-right { right: -12px; }
  .cal-today-btn {
    display: block;
    margin: 6px auto 0;
    background: none;
    border: 1px solid #2a2d3a;
    border-radius: 6px;
    color: #666;
    font-size: 11px;
    padding: 3px 12px;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  .cal-today-btn:hover { color: #ccc; border-color: #555; }

  .controls input[type="date"] { display: none; }
  .divider { display: none; }
  .jump-btn { display: none; }
  .controls label { display: none; }
  .controls { margin-bottom: 0; }

  /* ── Table ── */
  .table-section { max-width: 1100px; margin: 0 auto; padding: 0 24px 40px; }
  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .table-title { font-size: 14px; font-weight: 600; color: #888; }

  .table-wrap {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 12px;
    overflow: hidden;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table thead th {
    background: #111318;
    padding: 10px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #555;
    border-bottom: 1px solid #2a2d3a;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .data-table td {
    padding: 9px 16px;
    border-bottom: 1px solid #1e2130;
    vertical-align: middle;
  }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tbody tr:hover td { background: rgba(255,255,255,0.02); }

  /* selected row */
  .data-table tbody tr.selected-row td {
    background: rgba(255,255,255,0.05);
  }
  .data-table tbody tr.selected-row td:first-child {
    border-left: 3px solid var(--accent, #22c55e);
    padding-left: 13px;
  }

  /* today row */
  .data-table tbody tr.today-row td { background: rgba(255,255,255,0.03); }

  /* in-korea row */
  .data-table tbody tr.in-korea td { background: rgba(59,130,246,0.04); }

  .col-date { color: #ccc; font-weight: 500; min-width: 120px; }
  .col-date .weekday { color: #555; font-weight: 400; font-size: 11px; margin-left: 4px; }
  .col-relative { color: #666; font-size: 12px; min-width: 90px; }
  .col-location { min-width: 80px; }

  .location-kr {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(59,130,246,0.15);
    color: #60a5fa;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px; font-weight: 600;
  }
  .location-hk {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(168,85,247,0.12);
    color: #c084fc;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px; font-weight: 600;
  }
  .location-other {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(156,163,175,0.1);
    color: #9ca3af;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px; font-weight: 600;
  }

  .col-used { color: #e0e0e0; font-variant-numeric: tabular-nums; min-width: 90px; }
  .col-left { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 90px; }
  .col-bar { min-width: 140px; }

  .mini-bar-bg { background: #2a2d3a; border-radius: 999px; height: 6px; overflow: hidden; }
  .mini-bar-fill { height: 100%; border-radius: 999px; }

  .col-note { color: #666; font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
  .col-note:hover { color: #999; }
  .col-note input {
    background: transparent;
    border: none;
    border-bottom: 1px solid #444;
    color: #ccc;
    font-size: 12px;
    outline: none;
    width: 100%;
    padding: 0;
  }

  /* status colors */
  .safe   { color: #22c55e; }
  .warn   { color: #f59e0b; }
  .danger { color: #f97316; }
  .critical { color: #ef4444; }

  .bar-safe    { background: #22c55e; }
  .bar-warn    { background: #f59e0b; }
  .bar-danger  { background: #f97316; }
  .bar-critical { background: #ef4444; }

  /* table container scroll */
  .table-scroll { max-height: 620px; overflow-y: auto; }
  .table-scroll::-webkit-scrollbar { width: 6px; }
  .table-scroll::-webkit-scrollbar-track { background: transparent; }
  .table-scroll::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 3px; }

  /* ── Location badge (clickable) ── */
  .loc-badge {
    cursor: pointer;
    user-select: none;
    transition: opacity 0.1s, filter 0.1s;
  }
  .loc-badge:hover { filter: brightness(1.3); }
  .loc-badge-empty {
    display: inline-flex; align-items: center;
    cursor: pointer;
    color: #333;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px dashed #2a2d3a;
    transition: border-color 0.1s, color 0.1s;
  }
  .loc-badge-empty:hover { border-color: #555; color: #666; }
  .override-dot {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: #f59e0b;
    margin-left: 4px; vertical-align: middle;
  }

  /* ── Location picker popup ── */
  #locPicker {
    display: none;
    position: fixed;
    z-index: 100;
    background: #1e2130;
    border: 1px solid #3a3d4a;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    min-width: 160px;
  }
  #locPicker.open { display: block; }
  .picker-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #555; padding: 2px 6px 6px; border-bottom: 1px solid #2a2d3a;
    margin-bottom: 4px;
  }
  .picker-opt {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #ccc;
    transition: background 0.1s;
  }
  .picker-opt:hover { background: #2a2d3a; color: #fff; }
  .picker-opt.active { background: #2a2d3a; color: #fff; font-weight: 600; }
  .picker-sep { height: 1px; background: #2a2d3a; margin: 4px 0; }
  .picker-clear { color: #ef4444 !important; }
  .picker-clear:hover { background: rgba(239,68,68,0.1) !important; }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    border-bottom: 1px solid #2a2d3a;
    background: #1a1d27;
    max-width: 100%;
    position: sticky;
    top: 57px;
    z-index: 99;
  }
  .tab-btn {
    padding: 12px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: #666;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: #ccc; }
  .tab-btn.active { color: #fff; border-bottom-color: #60a5fa; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Stats panel ── */
  .stats-section { max-width: 900px; margin: 0 auto; padding: 32px 24px 60px; }
  .stats-year-block { margin-bottom: 40px; }
  .stats-year-title {
    font-size: 22px; font-weight: 800; color: #fff;
    margin-bottom: 6px; display: flex; align-items: baseline; gap: 12px;
  }
  .stats-year-total { font-size: 13px; font-weight: 400; color: #555; }
  .stats-bar-wrap {
    height: 36px; border-radius: 10px; overflow: hidden;
    display: flex; margin: 14px 0 16px;
    background: #1a1d27; border: 1px solid #2a2d3a;
  }
  .stats-bar-seg {
    height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #000; white-space: nowrap;
    overflow: hidden; transition: width 0.4s ease;
    min-width: 0;
  }
  .stats-bar-seg.seg-label-hide { color: transparent; }
  .stats-legend {
    display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 4px;
  }
  .stats-legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; color: #ccc;
  }
  .stats-legend-dot {
    width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
  }
  .stats-legend-days { font-weight: 700; color: #fff; }
  .stats-legend-pct { color: #666; font-size: 12px; }
  .stats-divider { border: none; border-top: 1px solid #2a2d3a; margin: 8px 0 32px; }

  /* ── Trips list ── */
  .trips-section { max-width: 1100px; margin: 0 auto; padding: 24px 24px 40px; }
  .trips-year-group { margin-bottom: 32px; }
  .trips-year-header {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #555;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .trips-year-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #2a2d3a;
  }
  .trips-year-total {
    font-size: 11px;
    font-weight: 400;
    color: #444;
    margin-left: 4px;
  }
  .trip-card {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 12px;
    align-items: center;
    transition: border-color 0.15s;
  }
  .trip-card:hover { border-color: #3a3d4a; }
  .trip-card.past { opacity: 0.55; }
  .trip-card.active-trip {
    border-color: #3b82f6;
    background: rgba(59,130,246,0.06);
  }
  .trip-card.upcoming { border-color: #2a2d3a; }
  .trip-num {
    font-size: 11px;
    font-weight: 700;
    color: #555;
    text-align: center;
  }
  .trip-body { min-width: 0; }
  .trip-dates {
    font-size: 13px;
    font-weight: 600;
    color: #ccc;
    margin-bottom: 3px;
  }
  .trip-dates .arrow { color: #444; margin: 0 6px; }
  .trip-days-badge {
    display: inline-block;
    background: rgba(59,130,246,0.15);
    color: #60a5fa;
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
  }
  .trip-note {
    font-size: 12px;
    color: #666;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trip-meta {
    text-align: right;
    white-space: nowrap;
  }
  .trip-remaining {
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
  }
  .trip-remaining-label {
    font-size: 10px;
    color: #555;
    margin-top: 2px;
  }

  /* ── Trip edit ── */
  .trip-edit-icon {
    display: block; width: 100%; background: none; border: none;
    cursor: pointer; color: #3a3d4a; font-size: 13px; padding: 3px 0;
    border-radius: 4px; margin-top: 6px; text-align: center;
    transition: color 0.1s, background 0.1s;
  }
  .trip-card:hover .trip-edit-icon { color: #666; }
  .trip-edit-icon:hover { color: #aaa !important; background: #2a2d3a; }
  .trip-card-editing { grid-template-columns: 36px 1fr !important; }
  .trip-card-editing .trip-meta { display: none; }
  .trip-edit-form { display: flex; flex-direction: column; gap: 8px; padding: 2px 0; }
  .trip-edit-dates { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .trip-edit-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .trip-edit-input {
    background: #0f1117; border: 1px solid #3a3d4a; border-radius: 6px;
    color: #e0e0e0; padding: 5px 9px; font-size: 13px; outline: none; cursor: pointer;
  }
  .trip-edit-input:focus { border-color: #60a5fa; }
  .trip-edit-note-input {
    background: #0f1117; border: 1px solid #3a3d4a; border-radius: 6px;
    color: #e0e0e0; padding: 5px 9px; font-size: 13px; outline: none; width: 100%;
    font-family: inherit;
  }
  .trip-edit-note-input:focus { border-color: #60a5fa; }
  .trip-edit-actions { display: flex; gap: 6px; align-items: center; }
  .trip-edit-btn {
    padding: 5px 12px; border-radius: 6px; border: none;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .trip-save-btn { background: #3b82f6; color: #fff; }
  .trip-save-btn:hover { background: #2563eb; }
  .trip-cancel-btn { background: #2a2d3a; color: #aaa; }
  .trip-cancel-btn:hover { background: #3a3d4a; color: #fff; }
  .trip-delete-btn { background: rgba(239,68,68,0.12); color: #ef4444; margin-left: auto; }
  .trip-delete-btn:hover { background: rgba(239,68,68,0.28); }
  .trips-toolbar {
    display: flex; justify-content: flex-end; margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid #2a2d3a;
    position: sticky; top: 103px; z-index: 10;
    background: #0f1117;
    padding-top: 12px;
  }
  .add-trip-btn {
    background: none; border: 1px solid #3a3d4a; border-radius: 8px;
    color: #60a5fa; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .add-trip-btn:hover { background: rgba(59,130,246,0.1); border-color: #3b82f6; }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .status-card { flex-direction: column; }
    .status-col { padding: 20px 0; }
    .status-col + .status-col { border-left: none; border-top: 1px solid #2a2d3a; }
    .metric-value.days-left { font-size: 56px; }
    .col-note { display: none; }
    .metric-value { font-size: 32px; }
    .trip-card { grid-template-columns: 28px 1fr auto; }
  }

function dateToNum(d) {
  // Returns days since epoch (integer), timezone-safe
  const [y, m, day] = d.split('-').map(Number);
  return Date.UTC(y, m - 1, day) / 86400000;
}
function numToDateStr(n) {
  const d = new Date(n * 86400000);
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  const day = String(d.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

const LOCATION_MAP = new Map();

// Inline init (same logic as rebuildFromTrips(), defined later after computeAllRows)
KR_TRIPS_NUMS = TRIPS.map(t => ({s: dateToNum(t.entry), e: dateToNum(t.dep)}));
KR_DAY_SET.clear();
for (const t of KR_TRIPS_NUMS) for (let d = t.s; d <= t.e; d++) KR_DAY_SET.add(d);
LOCATION_MAP.clear();
for (const t of OTHER_TRIPS) {
  const s = dateToNum(t.entry), e = dateToNum(t.dep);
  for (let d = s; d <= e; d++) if (!LOCATION_MAP.has(d)) LOCATION_MAP.set(d, {country: t.country, note: t.note});
}
for (const t of KR_TRIPS_NUMS) for (let d = t.s; d <= t.e; d++) LOCATION_MAP.set(d, {country: 'KR', note: ''});

// Count Korea days in trailing window ending on dayNum.
// Matches spreadsheet exactly: window = [dayNum-365, dayNum], sums per-trip overlap.
// (This intentionally double-counts Jan 2 2026 which spans two trips, matching the source.)
// Overrides: if a day is overridden, it adds/removes from the base trip-overlap count.
function countKrDays(dayNum) {
  const winStart = dayNum - 365;
  let count = 0;
  for (const t of KR_TRIPS_NUMS) {
    const ovStart = Math.max(t.s, winStart);
    const ovEnd   = Math.min(t.e, dayNum);
    if (ovStart <= ovEnd) count += ovEnd - ovStart + 1;
  }
  // Apply day overrides: adjust count for each overridden day in window
  for (const [ds, country] of DAY_OVERRIDES) {
    const dn = dateToNum(ds);
    if (dn < winStart || dn > dayNum) continue;
    const wasKr  = KR_DAY_SET.has(dn);
    const isKrNow = (country === 'KR');
    if (isKrNow && !wasKr) count++;
    else if (!isKrNow && wasKr) count--;
  }
  return count;
}

const DAY_OVERRIDES = new Map();
const DAY_NOTES = new Map();  // dateStr → note string

function saveToServer() {
  fetch('/api/korea-data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ trips: TRIPS, overrides: [...DAY_OVERRIDES], day_notes: [...DAY_NOTES] }),
  }).catch(err => console.error('Save failed:', err));
}

function saveOverrides() {
  saveToServer();
}

function getEffectiveLocation(dayNum) {
  const ds = numToDateStr(dayNum);
  if (DAY_OVERRIDES.has(ds)) return {country: DAY_OVERRIDES.get(ds), note: '✏️ edited', overridden: true};
  const loc = LOCATION_MAP.get(dayNum) || null;
  if (loc) return {...loc, overridden: false};
  // Hong Kong is the home base: today & future days with no trip/override
  // default to HK (display only — does NOT change Korea-day counts). Past
  // untracked days stay blank so history isn't rewritten.
  if (dayNum >= TODAY_NUM) return {country: 'HK', note: '', overridden: false, isDefault: true};
  return null;
}

function isEffectiveKr(dayNum) {
  const ds = numToDateStr(dayNum);
  if (DAY_OVERRIDES.has(ds)) return DAY_OVERRIDES.get(ds) === 'KR';
  return KR_DAY_SET.has(dayNum);
}

const CAP = 182;

function lerpColor(a, b, t) {
  // a, b = [r,g,b]; t = 0..1
  const r = Math.round(a[0] + (b[0]-a[0]) * t);
  const g = Math.round(a[1] + (b[1]-a[1]) * t);
  const bl = Math.round(a[2] + (b[2]-a[2]) * t);
  return `rgb(${r},${g},${bl})`;
}
const C_GREEN  = [34, 197, 94];   // #22c55e  ≥18  Safe / Healthy
const C_AMBER  = [245, 158, 11];  // #f59e0b  ~12  Caution onset
const C_ORANGE = [249, 115, 22];  // #f97316  ~6   Warning
const C_RED    = [239, 68, 68];   // #ef4444  ≤0   over the cap
function gradientColor(remaining) {
  // Lower remaining = closer to the 182-day cap = warmer color.
  // Tuned so a 12–20 buffer reads green/healthy, warms through amber/orange
  // as it thins toward the cap, and goes red at or over the cap.
  if (remaining >= 18) return lerpColor(C_GREEN, C_GREEN, 0);
  if (remaining >= 12) { const t = (18 - remaining) / 6; return lerpColor(C_GREEN, C_AMBER, t); }
  if (remaining >= 6)  { const t = (12 - remaining) / 6; return lerpColor(C_AMBER, C_ORANGE, t); }
  if (remaining >= 1)  { const t = (6 - remaining) / 5;  return lerpColor(C_ORANGE, C_RED, t); }
  return lerpColor(C_RED, C_RED, 0);
}
function getStatus(remaining) {
  const accent = gradientColor(remaining);
  const text =
    remaining >= 18 ? 'Safe' :
    remaining >= 12 ? 'Healthy' :
    remaining >= 6  ? 'Caution' :
    remaining >= 1  ? 'Warning' :
                      'Over cap!';
  return {cls:'', bar:'', text, accent};
}

function formatDateLong(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.toLocaleDateString('en-GB', {weekday:'long', year:'numeric', month:'long', day:'numeric', timeZone:'UTC'});
}
function formatDateShort(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short', year:'numeric', timeZone:'UTC'});
}
function getWeekday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', {weekday:'short', timeZone:'UTC'});
}

function relativeLabel(dateStr, todayNum) {
  const n = dateToNum(dateStr);
  const diff = n - todayNum;
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 0) return `+${diff}d`;
  return `${diff}d`;
}

// Table range: 365 days before first KR trip to end of 2026
const TABLE_START_NUM = dateToNum('2021-03-10') - 7;
const TABLE_END_NUM   = dateToNum('2026-12-31');

// (Re)compute all rows — called on init and after any override change
function computeAllRows() {
  allRows = [];
  for (let d = TABLE_START_NUM; d <= TABLE_END_NUM; d++) {
    const ds = numToDateStr(d);
    const used = countKrDays(d);
    const left = CAP - used;
    const loc  = getEffectiveLocation(d);
    const isKr = isEffectiveKr(d);
    allRows.push({dayNum: d, dateStr: ds, used, left, loc, isKr});
  }
}
let allRows = [];
computeAllRows();

function makeLocBadge(loc, dateStr) {
  const ovDot = (loc && loc.overridden) ? '<span class="override-dot" title="Manually overridden"></span>' : '';
  if (!loc) {
    return `<span class="loc-badge-empty" title="Click to set location">+</span>`;
  }
  const m = LOC_META[loc.country] || {cls:'location-other', icon:'', label: loc.country};
  return `<span class="loc-badge ${m.cls}" title="Click to change">${m.icon} ${m.label}${ovDot}</span>`;
}

let pickerTargetDate = null;

function openPicker(dateStr, cell) {
  pickerTargetDate = dateStr;
  const picker = document.getElementById('locPicker');
  document.getElementById('pickerTitle').textContent = dateStr;

  // Mark active option
  const currentOverride = DAY_OVERRIDES.get(dateStr);
  const currentCountry  = currentOverride || (LOCATION_MAP.get(dateToNum(dateStr)) || {}).country;
  picker.querySelectorAll('.picker-opt[data-country]').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.country === currentCountry);
  });

  // Position near cell (fixed = viewport-relative, no scroll offset needed)
  const rect = cell.getBoundingClientRect();
  const top = rect.bottom + 6;
  // Flip above if too close to bottom
  const pickerH = 230;
  picker.style.top  = (top + pickerH > window.innerHeight ? rect.top - pickerH - 4 : top) + 'px';
  picker.style.left = Math.min(rect.left, window.innerWidth - 180) + 'px';
  picker.classList.add('open');
}

function closePicker() {
  document.getElementById('locPicker').classList.remove('open');
  pickerTargetDate = null;
}

document.getElementById('locPicker').addEventListener('click', e => {
  const opt = e.target.closest('.picker-opt[data-country]');
  if (!opt || !pickerTargetDate) return;
  const country = opt.dataset.country;
  if (country === 'CLEAR') {
    DAY_OVERRIDES.delete(pickerTargetDate);
  } else {
    DAY_OVERRIDES.set(pickerTargetDate, country);
  }
  saveOverrides();
  closePicker();
  // Recompute and re-render
  computeAllRows();
  renderHero(selectedDate);
  buildWeeks();
});

// Close picker on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('#locPicker') && !e.target.closest('.loc-pick')) closePicker();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

function renderHero(dateStr) {
  const n = dateToNum(dateStr);
  const used = countKrDays(n);
  const left = CAP - used;
  const st = getStatus(left);

  document.getElementById('heroDate').innerHTML =
    formatDateLong(dateStr) +
    `<span class="relative-label">${relativeLabel(dateStr, TODAY_NUM)}</span>`;
  document.getElementById('heroDaysLeft').textContent = left;

  const card = document.getElementById('statusCard');
  card.style.setProperty('--accent', st.accent);

  const badge = document.getElementById('heroBadge');
  badge.style.setProperty('--accent', st.accent);
  badge.style.setProperty('--badge-bg', st.accent + '22');
  badge.querySelector('.status-dot').style.background = st.accent;
  document.getElementById('heroBadgeText').textContent = st.text;

  document.getElementById('heroDaysLeft').className = 'metric-value days-left';
  document.getElementById('heroDaysLeft').style.color = st.accent;
}

function getTripForDate(dateStr) {
  const n = dateToNum(dateStr);
  return TRIPS.find(t => dateToNum(t.entry) <= n && dateToNum(t.dep) >= n) || null;
}

function buildTable() {
  const tbody = document.getElementById('tableBody');
  const frag = document.createDocumentFragment();

  for (const row of allRows) {
    const tr = document.createElement('tr');
    const st = getStatus(row.left);
    const relLabel = relativeLabel(row.dateStr, TODAY_NUM);

    if (row.dateStr === selectedDate) tr.classList.add('selected-row');
    if (row.dateStr === TODAY_STR)    tr.classList.add('today-row');
    if (row.isKr)                     tr.classList.add('in-korea');

    tr.dataset.date = row.dateStr;
    tr.style.cursor = 'pointer';

    const locHTML = makeLocBadge(row.loc, row.dateStr);
    const dayNote = DAY_NOTES.get(row.dateStr) || '';

    tr.innerHTML = `
      <td class="col-date">${row.dateStr}<span class="weekday">${getWeekday(row.dateStr)}</span></td>
      <td class="col-relative">${relLabel}</td>
      <td class="col-location" data-date="${row.dateStr}">${locHTML}</td>
      <td class="col-left" style="color:${st.accent}">${row.left}</td>
      <td class="col-note" data-date="${row.dateStr}">${dayNote}</td>
    `;
    // Row click → select date (but not if clicking location or note)
    tr.addEventListener('click', e => {
      if (e.target.closest('.col-location')) return;
      if (e.target.closest('.col-note')) return;
      selectDate(row.dateStr);
    });
    // Location cell click → open picker
    tr.querySelector('.col-location').addEventListener('click', e => {
      e.stopPropagation();
      openPicker(row.dateStr, e.currentTarget);
    });
    // Note cell click → inline edit (any date)
    tr.querySelector('.col-note').addEventListener('click', e => {
      e.stopPropagation();
      const td = e.currentTarget;
      if (td.querySelector('input')) return;
      const ds = td.dataset.date;
      const cur = DAY_NOTES.get(ds) || '';
      td.innerHTML = `<input type="text" value="${cur.replace(/"/g,'&quot;')}" placeholder="Add note...">`;
      const inp = td.querySelector('input');
      inp.focus();
      inp.select();
      const finish = () => {
        const val = inp.value.trim();
        if (val) DAY_NOTES.set(ds, val);
        else DAY_NOTES.delete(ds);
        saveToServer();
        td.textContent = val;
      };
      inp.addEventListener('blur', finish);
      inp.addEventListener('keydown', e2 => {
        if (e2.key === 'Enter') inp.blur();
        if (e2.key === 'Escape') { td.textContent = cur; }
      });
    });
    frag.appendChild(tr);
  }
  tbody.innerHTML = '';
  tbody.appendChild(frag);
}

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('viewDailyBtn').style.background  = mode === 'daily'  ? '#3b82f6' : 'none';
  document.getElementById('viewDailyBtn').style.color       = mode === 'daily'  ? '#fff'    : '#666';
  document.getElementById('viewDailyBtn').style.borderColor = mode === 'daily'  ? '#3b82f6' : '#2a2d3a';
  document.getElementById('viewWeeklyBtn').style.background  = mode === 'weekly' ? '#3b82f6' : 'none';
  document.getElementById('viewWeeklyBtn').style.color       = mode === 'weekly' ? '#fff'    : '#666';

  if (mode === 'daily') {
    buildTable();

  } else {
    buildWeeklyTable();
  }
}

function buildWeeklyTable() {
  const tbody = document.getElementById('tableBody');
  const frag = document.createDocumentFragment();

  // Group allRows into weeks (Mon–Sun)
  const weeks = [];
  let week = null;
  for (const row of allRows) {
    const d = new Date(row.dateStr + 'T00:00:00');
    const dow = d.getDay(); // 0=Sun,1=Mon,...,6=Sat
    const isMonday = dow === 1;
    if (!week || isMonday) {
      week = { rows: [] };
      weeks.push(week);
    }
    week.rows.push(row);
  }

  const DOW_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  for (const wk of weeks) {
    const first = wk.rows[0];
    const last  = wk.rows[wk.rows.length - 1];
    const krDays = wk.rows.filter(r => r.isKr).length;
    const minLeft = Math.min(...wk.rows.map(r => r.left));
    const maxUsed = Math.max(...wk.rows.map(r => r.used));
    const pct = Math.min(100, (maxUsed / CAP) * 100);
    const st = getStatus(minLeft);
    const containsToday = wk.rows.some(r => r.dateStr === TODAY_STR);
    const containsSelected = wk.rows.some(r => r.dateStr === selectedDate);
    const firstD = new Date(first.dateStr + 'T00:00:00');
    const lastD  = new Date(last.dateStr  + 'T00:00:00');
    const fmt = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
    const weekLabel = `${fmt(firstD)} – ${fmt(lastD)}`;
    const relLabel = containsToday ? 'This week' : (dateToNum(first.dateStr) > TODAY_NUM ? `+${Math.ceil((dateToNum(first.dateStr)-TODAY_NUM)/7)}wk` : `-${Math.ceil((TODAY_NUM-dateToNum(last.dateStr))/7)}wk`);

    const tr = document.createElement('tr');
    if (containsSelected) tr.classList.add('selected-row');
    if (containsToday)    tr.classList.add('today-row');
    if (krDays > 0)       tr.classList.add('in-korea');
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', () => {
      const target = wk.rows.find(r => r.dateStr === TODAY_STR) || last;
      selectDate(target.dateStr);
    });

    tr.innerHTML = `
      <td class="col-date">${weekLabel}<span class="weekday">${DOW_LABELS[firstD.getDay()]}–${DOW_LABELS[lastD.getDay()]}</span></td>
      <td class="col-relative">${relLabel}</td>
      <td class="col-location">${krDays > 0 ? `<span class="location-kr">🇰🇷 ${krDays}d in KR</span>` : '<span style="color:#444;font-size:11px;">–</span>'}</td>
      <td class="col-left" style="color:${st.accent}">${minLeft}</td>
      <td class="col-note"></td>
    `;
    frag.appendChild(tr);
  }
  tbody.innerHTML = '';
  tbody.appendChild(frag);

  // Scroll to row containing today
  const rows = tbody.querySelectorAll('tr');
  const todayRow = [...rows].find(r => r.classList.contains('today-row'));
  if (todayRow) {
    const scroll = document.getElementById('tableScroll');
    scroll.scrollTop = todayRow.offsetTop - scroll.clientHeight / 2 + todayRow.clientHeight / 2;
  }
}

const openWeeks = new Set(); // week-start dateStrs currently expanded
const TWEMOJI_OPTS = { base: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/', folder: 'svg', ext: '.svg' };

function groupWeeks() {
  const weeks = [];
  let week = null;
  for (const row of allRows) {
    const d = new Date(row.dateStr + 'T00:00:00');
    if (!week || d.getDay() === 1) { week = { rows: [], key: row.dateStr }; weeks.push(week); }
    week.rows.push(row);
  }
  return weeks;
}

function buildWeeks() {
  const container = document.getElementById('weeksContainer');
  const scroll = document.getElementById('tableScroll');
  const prevTop = scroll ? scroll.scrollTop : 0;
  const frag = document.createDocumentFragment();
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  for (const wk of groupWeeks()) {
    const first = wk.rows[0], last = wk.rows[wk.rows.length - 1];
    const krDays = wk.rows.filter(r => r.isKr).length;
    const minLeft = Math.min(...wk.rows.map(r => r.left));
    const st = getStatus(minLeft);
    const containsToday = wk.rows.some(r => r.dateStr === TODAY_STR);
    const firstD = new Date(first.dateStr + 'T00:00:00');
    const lastD  = new Date(last.dateStr + 'T00:00:00');
    const fmt = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const relLabel = containsToday ? 'This week'
      : (dateToNum(first.dateStr) > TODAY_NUM
          ? `+${Math.ceil((dateToNum(first.dateStr) - TODAY_NUM) / 7)}wk`
          : `−${Math.ceil((TODAY_NUM - dateToNum(last.dateStr)) / 7)}wk`);

    const block = document.createElement('div');
    block.className = 'week-block' + (openWeeks.has(wk.key) ? ' open' : '') + (containsToday ? ' is-today' : '');
    block.dataset.wk = wk.key;

    const head = document.createElement('div');
    head.className = 'week-head';
    head.innerHTML =
      `<span class="week-caret">▸</span>` +
      `<span class="week-range">${fmt(firstD)} – ${fmt(lastD)}</span>` +
      `<span class="week-rel">${relLabel}</span>` +
      `<span class="week-summary">${krDays > 0 ? `<span class="week-kr">🇰🇷 ${krDays}d</span>` : ''}<span class="week-left" style="color:${st.accent}">${minLeft} left</span></span>`;
    head.addEventListener('click', () => toggleWeek(wk.key));
    block.appendChild(head);

    // collapsed: compact 7-day strip (left) + notes (right)
    const hWrap = document.createElement('div');
    hWrap.className = 'week-days-h';
    const strip = document.createElement('div');
    strip.className = 'week-days-strip';
    for (const r of wk.rows) {
      const d = new Date(r.dateStr + 'T00:00:00');
      const cell = document.createElement('div');
      cell.className = 'dcell loc-pick' + (r.dateStr === TODAY_STR ? ' is-today' : '') + (r.dateStr === selectedDate ? ' is-selected' : '');
      cell.dataset.date = r.dateStr;
      cell.innerHTML =
        `<span class="dcell-dow">${DOW[d.getDay()]}</span>` +
        `<span class="dcell-dom">${d.getDate()}</span>` +
        `<span class="dcell-loc">${makeLocBadge(r.loc, r.dateStr)}</span>` +
        `<span class="dcell-rem" style="background:${gradientColor(r.left)}">${r.left}</span>`;
      cell.addEventListener('click', e => { e.stopPropagation(); openPicker(r.dateStr, cell); });
      strip.appendChild(cell);
    }
    hWrap.appendChild(strip);

    const notes = document.createElement('div');
    notes.className = 'week-notes';
    const noted = wk.rows.filter(r => (DAY_NOTES.get(r.dateStr) || '').length);
    if (noted.length === 0) {
      const empty = document.createElement('span');
      empty.className = 'week-notes-empty';
      empty.textContent = 'No notes — expand the week to add holidays / reasons';
      notes.appendChild(empty);
    } else {
      for (const r of noted) {
        const d = new Date(r.dateStr + 'T00:00:00');
        const item = document.createElement('div');
        item.className = 'week-notes-item';
        const dt = document.createElement('span');
        dt.className = 'wn-date';
        dt.textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        const tx = document.createElement('span');
        tx.className = 'wn-text';
        tx.textContent = DAY_NOTES.get(r.dateStr);
        item.appendChild(dt); item.appendChild(tx);
        notes.appendChild(item);
      }
    }
    hWrap.appendChild(notes);
    block.appendChild(hWrap);

    // expanded: vertical day rows
    const vList = document.createElement('div');
    vList.className = 'week-days-v';
    for (const r of wk.rows) {
      const dst = getStatus(r.left);
      const note = DAY_NOTES.get(r.dateStr) || '';
      const drow = document.createElement('div');
      drow.className = 'drow loc-pick' + (r.dateStr === TODAY_STR ? ' is-today' : '') + (r.dateStr === selectedDate ? ' is-selected' : '');
      drow.dataset.date = r.dateStr;
      drow.innerHTML =
        `<span class="drow-date">${r.dateStr}<span class="weekday">${getWeekday(r.dateStr)}</span></span>` +
        `<span class="drow-loc">${makeLocBadge(r.loc, r.dateStr)}</span>` +
        `<span class="drow-left" style="color:${dst.accent}">${r.left} left</span>` +
        `<span class="drow-note" title="Click to add a note (holiday, reason, etc.)"></span>`;
      const noteEl = drow.querySelector('.drow-note');
      if (note) { noteEl.textContent = note; }
      else { noteEl.textContent = '+ note'; noteEl.style.color = '#3a3d4a'; }
      drow.addEventListener('click', e => {
        if (e.target.closest('.drow-note')) return;
        e.stopPropagation();
        openPicker(r.dateStr, drow.querySelector('.drow-loc'));
      });
      noteEl.addEventListener('click', e => { e.stopPropagation(); startNoteEdit(r.dateStr, noteEl); });
      vList.appendChild(drow);
    }
    block.appendChild(vList);

    frag.appendChild(block);
  }
  container.innerHTML = '';
  container.appendChild(frag);
  if (window.twemoji) twemoji.parse(container, TWEMOJI_OPTS);
  if (scroll) scroll.scrollTop = prevTop;
}

// Inline day-note editor (holiday / reason for a location). Persists & syncs.
function startNoteEdit(ds, el) {
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'note-input';
  inp.value = DAY_NOTES.get(ds) || '';
  el.textContent = '';
  el.style.color = '';
  el.appendChild(inp);
  inp.focus();
  inp.select();
  let done = false;
  const commit = save => {
    if (done) return; done = true;
    if (save) {
      const v = inp.value.trim();
      if (v) DAY_NOTES.set(ds, v); else DAY_NOTES.delete(ds);
      saveToServer();
    }
    buildWeeks();
  };
  inp.addEventListener('blur', () => commit(true));
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
  });
}

// ─────────────────────────────────────────────
// Calendar strip
// ─────────────────────────────────────────────
const CAL_RANGE = 30;   // days each side of anchor
let calAnchorNum = TODAY_NUM;  // the center of the strip

function buildCalStrip() {
  const strip = document.getElementById('calStrip');
  strip.innerHTML = '';
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const selNum = dateToNum(selectedDate);
  const accent = gradientColor(CAP - countKrDays(selNum));

  // update CSS variable for selected border
  strip.parentElement.style.setProperty('--sel-accent', accent);

  for (let offset = -CAL_RANGE; offset <= CAL_RANGE; offset++) {
    const num = calAnchorNum + offset;
    const ds  = numToDateStr(num);
    const d   = new Date(ds + 'T00:00:00');
    const dow  = DOW[d.getDay()];
    const dom  = d.getDate();

    const isToday    = ds === TODAY_STR;
    const isSelected = ds === selectedDate;
    const isKorea    = KR_DAY_SET.has(num);

    const div = document.createElement('div');
    div.className = 'cal-day' +
      (isToday    ? ' cal-today'    : '') +
      (isSelected ? ' cal-selected' : '') +
      (isKorea    ? ' cal-in-korea' : '');
    div.dataset.ds = ds;

    if (isSelected) {
      div.style.borderColor = accent;
      div.style.boxShadow   = `0 0 0 1px ${accent}33`;
    }

    const monEl = document.createElement('div');
    monEl.className = 'cal-month' + (dom === 1 || offset === -CAL_RANGE ? ' month-start' : '');
    monEl.textContent = d.toLocaleDateString('en-US', { month: 'short' });

    const dowEl = document.createElement('div');
    dowEl.className = 'cal-dow';
    dowEl.textContent = dow;
    if (isToday) dowEl.style.color = '#fff';

    const domEl = document.createElement('div');
    domEl.className = 'cal-dom';
    domEl.textContent = dom;

    const remaining = CAP - countKrDays(num);
    const remColor  = gradientColor(remaining);
    const remEl = document.createElement('div');
    remEl.className = 'cal-rem';
    remEl.textContent = remaining;
    remEl.style.background = remColor;
    remEl.style.color = '#000';

    div.appendChild(monEl);
    div.appendChild(dowEl);
    div.appendChild(domEl);
    div.appendChild(remEl);
    div.addEventListener('click', () => selectDate(ds));
    strip.appendChild(div);
  }

  // scroll so the selected day is centered in the visible strip
  const selIdx = selNum - calAnchorNum + CAL_RANGE;
  const CELL_W = 50; // 44px + 6px gap
  const stripW = strip.clientWidth;
  strip.scrollLeft = selIdx * CELL_W - stripW / 2 + CELL_W / 2;
}

function calScroll(dir) {
  calAnchorNum += dir * 15;
  buildCalStrip();
}

function calGoToday() {
  calAnchorNum = TODAY_NUM;
  selectDate(TODAY_STR);
}

// Patch selectDate to also refresh the strip
const _origSelectDate = selectDate;
selectDate = function(dateStr) {
  _origSelectDate(dateStr);
  // if selected date is outside current strip range, re-anchor on it
  const selNum = dateToNum(dateStr);
  if (Math.abs(selNum - calAnchorNum) > CAL_RANGE - 3) {
    calAnchorNum = selNum;
  }
  buildCalStrip();
};

// ─────────────────────────────────────────────
// Trip data persistence + rebuild
// ─────────────────────────────────────────────
function saveTRIPS() {
  saveToServer();
}

function renumberTrips() {
  TRIPS.sort((a, b) => a.entry < b.entry ? -1 : a.entry > b.entry ? 1 : 0);
  const counts = {};
  for (const t of TRIPS) {
    t.year = parseInt(t.entry.slice(0, 4));
    counts[t.year] = (counts[t.year] || 0) + 1;
    t.num = counts[t.year];
  }
}

function rebuildFromTrips() {
  KR_TRIPS_NUMS = TRIPS.map(t => ({s: dateToNum(t.entry), e: dateToNum(t.dep)}));
  KR_DAY_SET.clear();
  for (const t of KR_TRIPS_NUMS) for (let d = t.s; d <= t.e; d++) KR_DAY_SET.add(d);
  LOCATION_MAP.clear();
  for (const t of OTHER_TRIPS) {
    const s = dateToNum(t.entry), e = dateToNum(t.dep);
    for (let d = s; d <= e; d++) if (!LOCATION_MAP.has(d)) LOCATION_MAP.set(d, {country: t.country, note: t.note});
  }
  for (const t of KR_TRIPS_NUMS) for (let d = t.s; d <= t.e; d++) LOCATION_MAP.set(d, {country: 'KR', note: ''});
  computeAllRows();
  renderHero(selectedDate);
  buildWeeks();
}

// ─────────────────────────────────────────────
let editingTripIdx = -1;
let editingIsNew   = false;

function editTrip(idx) {
  editingTripIdx = idx;
  editingIsNew   = false;
  buildTripsPanel();
}

function cancelEdit() {
  if (editingIsNew) {
    TRIPS.splice(editingTripIdx, 1);
    renumberTrips();
    editingIsNew = false;
  }
  editingTripIdx = -1;
  buildTripsPanel();
}

function saveTrip(idx) {
  const entry = document.getElementById('edit-entry').value;
  const dep   = document.getElementById('edit-dep').value;
  const note  = document.getElementById('edit-note').value.trim();
  if (!entry || !dep || entry > dep) {
    alert('Entry date must be ≤ departure date.');
    return;
  }
  TRIPS[idx].entry = entry;
  TRIPS[idx].dep   = dep;
  TRIPS[idx].note  = note;
  editingIsNew   = false;
  editingTripIdx = -1;
  renumberTrips();
  saveTRIPS();
  rebuildFromTrips();
  buildTripsPanel();
}

function deleteTrip(idx) {
  if (!confirm('Delete this trip?')) return;
  TRIPS.splice(idx, 1);
  renumberTrips();
  saveTRIPS();
  editingTripIdx = -1;
  editingIsNew   = false;
  rebuildFromTrips();
  buildTripsPanel();
}

function addTrip() {
  const newTrip = { year: parseInt(TODAY_STR.slice(0,4)), num: 0, entry: TODAY_STR, dep: TODAY_STR, note: '' };
  TRIPS.push(newTrip);
  renumberTrips();
  editingTripIdx = TRIPS.indexOf(newTrip);
  editingIsNew   = true;
  buildTripsPanel();
  setTimeout(() => {
    const el = document.querySelector('.trip-card-editing');
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 170;
      window.scrollTo({top: Math.max(0, top), behavior: 'smooth'});
    }
  }, 60);
}

function scrollTripsToToday() {
  // Find the trip that is active (spans today) or the next upcoming trip
  const sorted = [...TRIPS].sort((a, b) => a.entry < b.entry ? -1 : 1);
  let target = sorted.find(t => dateToNum(t.entry) <= TODAY_NUM && dateToNum(t.dep) >= TODAY_NUM);
  if (!target) target = sorted.find(t => dateToNum(t.entry) > TODAY_NUM);
  if (!target) target = sorted[sorted.length - 1]; // fall back to most recent
  if (!target) return;
  const idx = TRIPS.indexOf(target);
  const el = document.querySelector(`.trip-card[data-trip-idx="${idx}"]`);
  if (el) el.scrollIntoView({behavior: 'smooth', block: 'center'});
}

function buildTripsPanel() {
  const container = document.getElementById('tripsSection');
  const years = [...new Set(TRIPS.map(t => t.year))].sort((a,b) => b - a);

  let html = `<div class="trips-toolbar">
    <button class="add-trip-btn" style="margin-right:auto;background:none;color:#666;border-color:#2a2d3a;font-weight:400" onclick="scrollTripsToToday()">Today</button>
    <button class="add-trip-btn" onclick="addTrip()">＋ Add Trip</button>
  </div>`;

  for (const year of years) {
    const yearTrips = TRIPS.filter(t => t.year === year);
    const totalDays = yearTrips.reduce((s, t) => s + dateToNum(t.dep) - dateToNum(t.entry) + 1, 0);
    html += `<div class="trips-year-group">
      <div class="trips-year-header">${year} <span class="trips-year-total">${yearTrips.length} trips · ${totalDays} days</span></div>`;

    for (const t of [...yearTrips].reverse()) {
      const idx      = TRIPS.indexOf(t);
      const depNum   = dateToNum(t.dep);
      const entryNum = dateToNum(t.entry);
      const days     = depNum - entryNum + 1;

      if (idx === editingTripIdx) {
        // ── Edit form ──
        html += `<div class="trip-card trip-card-editing">
          <div class="trip-num">#${t.num}</div>
          <div class="trip-edit-form">
            <div class="trip-edit-dates">
              <span class="trip-edit-label">Entry</span>
              <input type="date" class="trip-edit-input" id="edit-entry" value="${t.entry}">
              <span class="trip-edit-label">Departure</span>
              <input type="date" class="trip-edit-input" id="edit-dep" value="${t.dep}">
            </div>
            <input type="text" class="trip-edit-note-input" id="edit-note" placeholder="Note..." value="${(t.note||'').replace(/"/g,'&quot;')}">
            <div class="trip-edit-actions">
              <button class="trip-edit-btn trip-save-btn" onclick="saveTrip(${idx})">Save</button>
              <button class="trip-edit-btn trip-cancel-btn" onclick="cancelEdit()">Cancel</button>
              <button class="trip-edit-btn trip-delete-btn" onclick="deleteTrip(${idx})">Delete</button>
            </div>
          </div>
        </div>`;
      } else {
        // ── Display card ──
        const remaining = CAP - countKrDays(depNum);
        let cls = depNum < TODAY_NUM ? 'past' : (entryNum <= TODAY_NUM ? 'active-trip' : 'upcoming');
        const st = getStatus(remaining);
        const noteHtml = t.note ? `<div class="trip-note">${t.note}</div>` : '';

        // Collect per-day notes within this trip's range
        let dayNotesHtml = '';
        for (let dn = entryNum; dn <= depNum; dn++) {
          const ds = numToDateStr(dn);
          const n = DAY_NOTES.get(ds);
          if (n) {
            const [, m, d] = ds.split('-').map(Number);
            dayNotesHtml += `<div class="trip-note" style="color:#60a5fa">${m}/${d} ${n}</div>`;
          }
        }

        html += `<div class="trip-card ${cls}" data-trip-idx="${idx}">
          <div class="trip-num">#${t.num}</div>
          <div class="trip-body">
            <div class="trip-dates">
              ${formatShort(t.entry)} <span class="arrow">→</span> ${formatShort(t.dep)}
              <span class="trip-days-badge">${days}d</span>
            </div>
            ${noteHtml}
            ${dayNotesHtml}
          </div>
          <div class="trip-meta">
            <div class="trip-remaining" style="color:${st.accent}">${remaining}</div>
            <div class="trip-remaining-label">left at dep.</div>
            <button class="trip-edit-icon" onclick="jumpToTripInDaily('${t.entry}')" title="View in Daily">📅</button>
            <button class="trip-edit-icon" onclick="editTrip(${idx})" title="Edit trip">✏️</button>
          </div>
        </div>`;
      }
    }
    html += '</div>';
  }
  container.innerHTML = html;
  requestAnimationFrame(() => scrollTripsToToday());
}

// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// Danger Panel — upcoming dates with a thin buffer (caution/warning) or over the cap
// ─────────────────────────────────────────────

function buildDangerPanel() {
  const panel = document.getElementById('dangerPanel');
  const endNum = Math.min(TODAY_NUM + 365, TABLE_END_NUM);

  const daysCaution = [], daysWarning = [], daysOver = [];
  for (let d = TODAY_NUM + 1; d <= endNum; d++) {
    const left = CAP - countKrDays(d);
    const ds = numToDateStr(d);
    if (left < 10) daysCaution.push({ ds, left });
    if (left < 5)  daysWarning.push({ ds, left });
    if (left < 1)  daysOver.push({ ds, left });
  }

  function makeDateList(days, color) {
    if (days.length === 0) return '';
    return days.map(({ ds, left }) => {
      const wday = getWeekday(ds);
      const [y, m, d] = ds.split('-').map(Number);
      const label = new Date(Date.UTC(y, m-1, d)).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'});
      return `<div style="display:flex;justify-content:space-between;padding:4px 10px;font-size:12px;border-bottom:1px solid #1a1d27;">
        <span style="color:#aaa">${wday} ${label}</span>
        <span style="font-weight:700;color:${color}">${left}d</span>
      </div>`;
    }).join('');
  }

  function row(id, count, label, color, days) {
    const dim = count === 0;
    const dateList = makeDateList(days, color);
    return `
      <div style="border-bottom:1px solid #1e2130;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;">
          <span style="font-size:13px;color:${dim ? '#444' : '#888'}">${label}</span>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:22px;font-weight:800;color:${dim ? '#333' : color}">${count}</span>
            ${count > 0 ? `<button onclick="toggleDanger('${id}')" style="background:#1e2130;border:1px solid #2a2d3a;color:#888;font-size:11px;padding:3px 9px;border-radius:5px;cursor:pointer;" id="btn-${id}">▼ Show</button>` : ''}
          </div>
        </div>
        <div id="${id}" style="display:none;background:#0d0f18;border-radius:6px;margin-bottom:8px;overflow:hidden;">
          ${dateList}
        </div>
      </div>`;
  }

  panel.innerHTML = `
    <div class="danger-title">⚠️ Next 365 days · days remaining in cap</div>
    ${row('danger-10', daysCaution.length, 'Days with < 10 remaining (caution)', '#eab308', daysCaution)}
    ${row('danger-5',  daysWarning.length, 'Days with < 5 remaining (warning)',  '#f97316', daysWarning)}
    ${row('danger-0',  daysOver.length,    'Days at or over the cap',            '#ef4444', daysOver)}`;
}

function toggleDanger(id) {
  const el  = document.getElementById(id);
  const btn = document.getElementById('btn-' + id);
  const open = el.style.display === 'none';
  el.style.display  = open ? 'block' : 'none';
  btn.textContent = open ? '▲ Hide' : '▼ Show';
}

// Annual Stats
// ─────────────────────────────────────────────
const STAT_COLORS = {
  KR:    '#22c55e',
  HK:    '#60a5fa',
  JP:    '#f87171',
  CN:    '#f97316',
  MO:    '#a78bfa',
  PH:    '#fbbf24',
  US:    '#38bdf8',
  UK:    '#818cf8',
  TH:    '#34d399',
  OTHER: '#6b7280',
};

function computeAnnualStats(year) {
  const startNum = dateToNum(`${year}-01-01`);
  const endNum   = dateToNum(`${year}-12-31`);
  const counts   = {};
  const daysInYear = endNum - startNum + 1;

  for (let d = startNum; d <= endNum; d++) {
    if (d > TODAY_NUM) break; // don't count future days
    const loc = getEffectiveLocation(d);
    const country = loc ? loc.country : 'HK'; // untracked = HK home base
    counts[country] = (counts[country] || 0) + 1;
  }
  return { counts, daysInYear };
}

function buildStatsPanel() {
  const sec = document.getElementById('statsSection');
  const todayYear = new Date().getUTCFullYear();
  const firstYear = 2021;
  let html = '';

  for (let yr = todayYear; yr >= firstYear; yr--) {
    const { counts, daysInYear } = computeAnnualStats(yr);
    const totalCounted = Object.values(counts).reduce((s, v) => s + v, 0);
    if (totalCounted === 0) continue;

    // Sort countries: KR first, HK second, then by count desc
    const sorted = Object.entries(counts).sort(([a, av], [b, bv]) => {
      if (a === 'KR') return -1; if (b === 'KR') return 1;
      if (a === 'HK') return -1; if (b === 'HK') return 1;
      return bv - av;
    });

    // Bar segments
    let barHtml = '';
    for (const [country, days] of sorted) {
      const pct = (days / totalCounted * 100).toFixed(1);
      const color = STAT_COLORS[country] || STAT_COLORS.OTHER;
      const m = LOC_META[country] || { icon: '✈️', label: country };
      const showLabel = days / totalCounted > 0.07;
      barHtml += `<div class="stats-bar-seg${showLabel ? '' : ' seg-label-hide'}"
        style="width:${pct}%;background:${color};"
        title="${m.icon} ${m.label}: ${days}d (${pct}%)">${showLabel ? m.icon + ' ' + days + 'd' : ''}</div>`;
    }

    // Legend
    let legendHtml = '';
    for (const [country, days] of sorted) {
      const pct = (days / totalCounted * 100).toFixed(1);
      const color = STAT_COLORS[country] || STAT_COLORS.OTHER;
      const m = LOC_META[country] || { icon: '✈️', label: country };
      legendHtml += `<div class="stats-legend-item">
        <div class="stats-legend-dot" style="background:${color}"></div>
        ${m.icon} ${m.label}
        <span class="stats-legend-days">${days}d</span>
        <span class="stats-legend-pct">${pct}%</span>
      </div>`;
    }

    const isCurrentYear = yr === todayYear;
    const yearLabel = isCurrentYear ? `${yr} <span style="font-size:13px;color:#555;font-weight:400">(YTD — ${totalCounted} of ${daysInYear} days)</span>` : yr;

    html += `<div class="stats-year-block">
      <div class="stats-year-title">${yearLabel}</div>
      <div class="stats-bar-wrap">${barHtml}</div>
      <div class="stats-legend">${legendHtml}</div>
    </div>
    <hr class="stats-divider">`;
  }

  sec.innerHTML = html || '<p style="color:#555;padding:40px 0">No data yet.</p>';
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'stats') {
    buildStatsPanel();
  }
}

// ── Cross-platform emoji rendering ──────────────────────────────
// Country flags are regional-indicator emoji (🇰🇷 etc.) which Windows
// refuses to render. Twemoji replaces emoji text with <img>, so flags
// show on every OS. Parse the initial DOM, then watch for the app's
// dynamic renders (tables, badges, calendar strip) and parse just the
// newly-added subtrees. The observer is disconnected while parsing so
// Twemoji's own <img> insertions don't retrigger it.
(function () {
  if (!window.twemoji) return;
  const OPTS = {
    base: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/',
    folder: 'svg',
    ext: '.svg',
  };
  const obs = new MutationObserver(muts => {
    obs.disconnect();
    for (const m of muts) {
      for (const node of m.addedNodes) {
        if (node.nodeType === 1) twemoji.parse(node, OPTS);
      }
    }
    obs.observe(document.body, { childList: true, subtree: true });
  });
  twemoji.parse(document.body, OPTS);
  obs.observe(document.body, { childList: true, subtree: true });
})();
</script>
